<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="quadrado">
        <h1>Tela de login</h1>

        <form>
            <div class="form-control">
                <label for="Login">Login: </label>
                <input type="text" id="login" placeholder="Digite seu login">
            </div>
        </form>
        
            <div class="quadrado">

                <form>
                    <div class="form-control">
                        <label for="Email">E-mail: </label>
                        <input type="email" id="email" placeholder="Digite seu email">
                    </div>

                </form>

                <form>
                    <div class="form-control">
                        <label for="senha">Senha: </label>
                        <input type="password" id="senha" placeholder="Digite sua senha">
                    </div>

                </form>
                <form>

                    <div class="form-control">
                        <div class="opcoes">
                            <input type="checkbox" id="opcao">
                            <label for="lembrar">Lembrar meu login</label>
                        </div>
                    </div>

                    <form>
                        <div class="form-control">
                            <label>Tipo de acesso: </label>

                            <div class="opcoes">
                                <input type="radio" name="tipo" id="aluno">
                                <label for="aluno">Aluno </label>
                                <input type="radio" name="tipo" id="professor">
                                <label for="professor">Professor</label>
                            </div>
                        </div>

                        <form>
                            <div class="form-control">
                                <label for="senha">Senha</label>
                                <input type="password" id="senha" placeholder="Digite sua senha">
                            </div>
                        </form>
                        <form>
                            <div class="form-control">
                                <button type="submit">Entrar</button>
                            </div>

                            <a href="esqueci-minha-senha.html">Esqueci minha senha</a>

                        </form>

                    </form>


                </form>
            </div>
</body>

</html>
